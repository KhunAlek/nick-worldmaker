name: Automatic release chain

on:
  push:
    branches: [main]
    paths:
      - assets/js/mission-release-manifest.js
      - backend/src/index.js
      - backend/wrangler.toml

permissions:
  contents: write

concurrency:
  group: worldmaker-release-promotion
  cancel-in-progress: false

jobs:
  release-next:
    runs-on: ubuntu-latest
    env:
      API_URL: https://nick-worldmaker-api.abystrov66.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve next unreleased mission
        run: node scripts/resolve-next-release.mjs
      - name: Stop when all missions are released
        if: env.ALL_RELEASED == 'true'
        run: echo "All Version 1 missions are released."
      - name: Wire controlled fixtures
        if: env.ALL_RELEASED != 'true'
        run: node scripts/enable-late-release-fixtures.mjs
      - name: Audit current source
        if: env.ALL_RELEASED != 'true'
        run: node tests/release-audit.mjs
      - name: Create fresh isolated release family
        if: env.ALL_RELEASED != 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          FAMILY_ID="$(python -c 'import uuid; print(uuid.uuid4())')"
          echo "FAMILY_ID=$FAMILY_ID" >> "$GITHUB_ENV"
          SQL="INSERT INTO families(id,display_name) VALUES('${FAMILY_ID}','Release Test ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'); INSERT INTO mission_progress(family_id,mission_id,status,hint_level) VALUES('${FAMILY_ID}','${MISSION_ID}','NOT_SUBMITTED',0);"
          npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../family-seed.json
          SQL="SELECT family_id,mission_id,status,hint_level FROM mission_progress WHERE family_id IN (SELECT id FROM families WHERE display_name NOT LIKE 'Release Test %') ORDER BY family_id,mission_id;"
          npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../real-family-before.json
          jq -S '.[0].results' ../real-family-before.json > ../real-family-before-sorted.json
          node ../scripts/configure-release-pilot.mjs "$FAMILY_ID" "$MISSION_ID"
      - name: Rotate isolated token
        if: env.ALL_RELEASED != 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "RELEASE_TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$TOKEN" | npx wrangler secret put RELEASE_TEST_TOKEN
      - name: Deploy isolated pilot
        if: env.ALL_RELEASED != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
      - name: Run evaluator gates
        if: env.ALL_RELEASED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RELEASE_TEST_TOKEN" -H "Content-Type: application/json" -X POST "$API_URL/internal/release-test/$MISSION_ID/needs_evidence" > non-approved.json
          jq -e '.review.status != "APPROVED" and .review.unlock_next_mission == false and .review.next_mission_id == null' non-approved.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RELEASE_TEST_TOKEN" -H "Content-Type: application/json" -X POST "$API_URL/internal/release-test/$MISSION_ID/approved" > approved.json
          if [ -n "$NEXT_ID" ]; then
            jq -e --arg next "$NEXT_ID" '.review.status == "APPROVED" and .review.unlock_next_mission == true and .review.next_mission_id == $next' approved.json
          else
            jq -e '.review.status == "APPROVED" and .review.unlock_next_mission == false and .review.next_mission_id == null' approved.json
          fi
      - name: Verify D1 and shared views
        if: env.ALL_RELEASED != 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$NEXT_ID" ]; then
            SQL="SELECT (SELECT COUNT(*) FROM submissions WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') submissions_count,(SELECT COUNT(*) FROM reviews WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}' AND validated=1) reviews_count,(SELECT status FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') mission_status,(SELECT status FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id='${NEXT_ID}') next_status,(SELECT COUNT(*) FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id>'${NEXT_ID}') later_count;"
            npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../approved-d1.json
            jq -e '.[0].results[0] | .submissions_count == 2 and .reviews_count == 2 and .mission_status == "APPROVED" and .next_status == "NOT_SUBMITTED" and .later_count == 0' ../approved-d1.json
          else
            SQL="SELECT (SELECT COUNT(*) FROM submissions WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') submissions_count,(SELECT COUNT(*) FROM reviews WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}' AND validated=1) reviews_count,(SELECT status FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') mission_status;"
            npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../approved-d1.json
            jq -e '.[0].results[0] | .submissions_count == 2 and .reviews_count == 2 and .mission_status == "APPROVED"' ../approved-d1.json
          fi
          cd ..
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RELEASE_TEST_TOKEN" "$API_URL/internal/release-test/views" > views.json
      - name: Record, promote, and deploy
        if: env.ALL_RELEASED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          NON_STATUS="$(jq -r '.review.status' non-approved.json)"
          jq -n --arg mission "$MISSION_ID" --arg non "$NON_STATUS" '{harness_version:"worldmaker-release-harness-v1",mission_id:$mission,live_model_classification:{non_approved:$non,valid_submission:"APPROVED"},production_d1_smoke:{submission_records_immutable:true,review_records_immutable:true,audit_records_created:true,nonapproval_did_not_unlock:true,approval_unlocked_exact_next:true,no_later_mission_unlocked:true,shared_progress_visible:true,parent_view_visible:true}}' > release-report.json
          node scripts/record-live-release-result.mjs "$MISSION_ID" release-report.json
          node scripts/promote-mission.mjs "$MISSION_ID"
          if [ -n "$NEXT_ID" ]; then node scripts/configure-release-pilot.mjs "$FAMILY_ID" "$NEXT_ID"; fi
          node tests/release-audit.mjs
      - name: Deploy official release
        if: env.ALL_RELEASED != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
      - name: Verify production isolation
        if: env.ALL_RELEASED != 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$API_URL/health" > ../health.json
          jq -e '.ok == true and .service == "nick-worldmaker-api"' ../health.json
          SQL="SELECT family_id,mission_id,status,hint_level FROM mission_progress WHERE family_id IN (SELECT id FROM families WHERE display_name NOT LIKE 'Release Test %') ORDER BY family_id,mission_id;"
          npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../real-family-after.json
          jq -S '.[0].results' ../real-family-after.json > ../real-family-after-sorted.json
          diff -u ../real-family-before-sorted.json ../real-family-after-sorted.json
      - name: Commit verified promotion
        if: env.ALL_RELEASED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "worldmaker-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/index.js backend/src/release-test-wrapper.js backend/wrangler.toml assets/js/mission-release-manifest.js tests/live-results/
          git commit -m "Promote $MISSION_ID with automatic fresh-family release gates"
          git push
      - name: Upload evidence
        if: always() && env.ALL_RELEASED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MISSION_ID }}-automatic-release
          path: |
            family-seed.json
            non-approved.json
            approved.json
            approved-d1.json
            views.json
            release-report.json
            health.json
            real-family-before-sorted.json
            real-family-after-sorted.json
