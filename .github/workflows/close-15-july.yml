name: Close 15 July 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-15-july.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: https://nick-worldmaker-api.abystrov66.workers.dev

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Execute Parts 3–8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/close-15-july.sh
      - name: Remove closure test-family residue
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd backend
          npx wrangler d1 execute worldmaker-db --remote --command "DELETE FROM sessions WHERE family_id LIKE 'closure-m3-%'; DELETE FROM reviews WHERE family_id LIKE 'closure-m3-%'; DELETE FROM submissions WHERE family_id LIKE 'closure-m3-%'; DELETE FROM audit_log WHERE family_id LIKE 'closure-m3-%'; DELETE FROM mission_progress WHERE family_id LIKE 'closure-m3-%'; DELETE FROM families WHERE id LIKE 'closure-m3-%';"
      - name: Copy human visual-review evidence
        run: |
          mkdir -p release-evidence/2026-07-15-closure
          cat > release-evidence/2026-07-15-closure/human-review-summary.json <<'JSON'
          {
            "reviewer":"Alex Bystrov",
            "review_date":"2026-07-16",
            "learner_view":"FAIL — needs correction before Nick continues",
            "learner_view_primary_defect":"M3 does not explain where to find or open Rig Generator; the instruction to drag the entire Model is misleading.",
            "parent_view":"PASS WITH MINOR ISSUES"
          }
          JSON
      - name: Update tracker closure section
        run: |
          cat >> Nick_Worldmaker_Comprehensive_Project_Tracker_2026-07-15.md <<'MD'

          ---

          ## 15 July 2026 formal closure — completed 16 July 2026

          Parts 3–8 were executed through a source-controlled production closure workflow.

          Technical closure status:

          - production `/health` verified with `ok: true`, service `nick-worldmaker-api`, production entrypoint, and non-placeholder source/build metadata;
          - production D1 exported and entered in the source-controlled backup register;
          - temporary release-test token revoked and verified absent;
          - temporary pilot variables removed;
          - production entrypoint restored;
          - release manifest confirmed as M3–M6 released and live-passed;
          - deployed source fingerprint matched `backend/src/production-entry.js`;
          - prior isolated release-test families inventoried;
          - a fresh isolated M3 negative fixture remained non-approved and did not unlock;
          - a fresh isolated M3 approved fixture unlocked exactly M4 and no later mission;
          - Nick's real family mission-progress snapshot was byte-for-byte unchanged;
          - closure test-family rows were deleted after verification.

          Human review status:

          - Parent View: **PASS WITH MINOR ISSUES**.
          - Learner View / M3 lesson: **FAIL — needs correction before Nick continues**. The lesson does not explain where to find/open Rig Generator and contains misleading object-movement wording. This is now a recorded learner-content release defect. M3 must be corrected and visually re-reviewed before Nick resumes it.

          Evidence is committed under `release-evidence/2026-07-15-closure/`, with the formal report at `docs/operations/15-july-2026-closure-report.md` and backup register at `docs/operations/d1-backup-register.md`.
          MD
      - name: Commit closure evidence
        run: |
          git config user.name worldmaker-closure-bot
          git config user.email actions@users.noreply.github.com
          git add backend/wrangler.toml release-evidence/ docs/operations/ Nick_Worldmaker_Comprehensive_Project_Tracker_2026-07-15.md
          git commit -m 'Close 15 July production verification and record evidence'
          git push origin HEAD:main
      - name: Upload closure bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldmaker-15-july-closure-${{ github.run_id }}
          path: |
            release-evidence/2026-07-15-closure/
            docs/operations/
          if-no-files-found: warn
# trigger: 2026-07-16T05:44Z
