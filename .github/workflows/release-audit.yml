name: Mission release audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run executable release audit
        shell: bash
        run: |
          set -o pipefail
          node tests/release-audit.mjs 2>&1 | tee release-audit.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-release-audit-log
          path: release-audit.log
          if-no-files-found: error
