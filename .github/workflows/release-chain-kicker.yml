name: Release chain kicker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldmaker-release-kicker
  cancel-in-progress: true

jobs:
  trigger-next-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether another mission remains
        id: release-state
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(python - <<'PY'
          import re
          text=open('assets/js/mission-release-manifest.js', encoding='utf-8').read()
          match=re.search(r'const releasedIds=\[(.*?)\];', text, re.S)
          print(len(re.findall(r'"V1-M\d{2}"', match.group(1))) if match else 0)
          PY
          )"
          echo "released_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 13 ]; then
            echo "all_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait while a promotion commit is already running
        if: steps.release-state.outputs.all_released != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE="$(gh run list --workflow auto-release-chain.yml --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "A release promotion is already active."
            echo "SKIP_TRIGGER=true" >> "$GITHUB_ENV"
          fi
      - name: Touch manifest trigger safely
        if: steps.release-state.outputs.all_released != 'true' && env.SKIP_TRIGGER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from datetime import datetime, timezone
          path='assets/js/mission-release-manifest.js'
          text=open(path, encoding='utf-8').read()
          stamp=datetime.now(timezone.utc).strftime('%Y-%m-%d.%H%M%S')
          text=re.sub(r'version:"[^"]+"', f'version:"{stamp}"', text, count=1)
          open(path, 'w', encoding='utf-8').write(text)
          PY
          git config user.name "worldmaker-release-kicker"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/mission-release-manifest.js
          git commit -m "Continue automatic mission release chain"
          git push
