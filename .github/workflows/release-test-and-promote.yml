name: Release test and promote mission

on:
  pull_request:
    branches: [main]
    paths:
      - .github/m7-release-trigger.txt
  workflow_dispatch:
    inputs:
      mission_id:
        description: Mission to test and promote
        required: true
        default: V1-M07
        type: string
      next_mission_id:
        description: Exact next mission
        required: true
        default: V1-M08
        type: string

permissions:
  contents: write

concurrency:
  group: worldmaker-release-promotion
  cancel-in-progress: false

jobs:
  release-test:
    runs-on: ubuntu-latest
    env:
      MISSION_ID: ${{ inputs.mission_id || 'V1-M07' }}
      NEXT_ID: ${{ inputs.next_mission_id || 'V1-M08' }}
      API_URL: https://nick-worldmaker-api.abystrov66.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete isolated M7 release
        run: bash scripts/run-m7-release.sh
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V1-M07-complete-release-${{ github.run_id }}
          path: |
            family-seed.json
            needs-evidence.json
            needs-fix.json
            wrong-ids.json
            suspicious.json
            no-selection.json
            valid-wood.json
            valid-stone.json
            invalid-resource.json
            invalid-npc.json
            approved.json
            non-approved-d1.json
            approved-d1.json
            views.json
            health.json
            real-family-before-sorted.json
            real-family-after-sorted.json
            cleanup-proof.json
            unauthorized-before.json
            unauthorized-after.json
            cleanup-d1.json
            cleanup-deploy.log
            final-release-identity.json
            tests/live-results/V1-M07-release-evidence.json
            tests/live-results/V1-M07.json
