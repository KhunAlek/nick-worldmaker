name: Release test and promote mission

on:
  push:
    branches: [main]
    paths:
      - backend/src/release-test-wrapper.js
      - backend/wrangler.toml
      - scripts/record-live-release-result.mjs
      - .github/workflows/release-test-and-promote.yml
  workflow_dispatch:
    inputs:
      mission_id:
        description: Pilot mission to test and promote
        required: true
        default: V1-M04
        type: string
      next_mission_id:
        description: Exact next mission
        required: true
        default: V1-M05
        type: string

permissions:
  contents: write

concurrency:
  group: worldmaker-release-promotion
  cancel-in-progress: false

jobs:
  release-test:
    runs-on: ubuntu-latest
    env:
      MISSION_ID: ${{ inputs.mission_id || 'V1-M04' }}
      NEXT_ID: ${{ inputs.next_mission_id || 'V1-M05' }}
      FAMILY_ID: 1225785f-3bdb-4847-bdca-4bdcc9c27788
      API_URL: https://nick-worldmaker-api.abystrov66.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run source and contract audit
        run: node scripts/audit-mission-releases.mjs

      - name: Deploy pilot Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Rotate isolated harness token
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "RELEASE_TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$TOKEN" | npx wrangler secret put RELEASE_TEST_TOKEN

      - name: Run non-approved evaluator smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_TEST_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$API_URL/internal/release-test/$MISSION_ID/needs_evidence" \
            > non-approved.json
          jq -e '.review.status == "NEEDS_EVIDENCE" and .review.unlock_next_mission == false and .review.next_mission_id == null' non-approved.json

      - name: Verify non-approval did not unlock next mission
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT COUNT(*) AS next_count FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id='${NEXT_ID}';"
          npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../non-approved-d1.json
          jq -e '.[0].results[0].next_count == 0' ../non-approved-d1.json

      - name: Run approved evaluator smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_TEST_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$API_URL/internal/release-test/$MISSION_ID/approved" \
            > approved.json
          jq -e --arg next "$NEXT_ID" '.review.status == "APPROVED" and .review.unlock_next_mission == true and .review.next_mission_id == $next' approved.json

      - name: Verify immutable records and exact-next D1 state
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT (SELECT COUNT(*) FROM submissions WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') AS submissions_count, (SELECT COUNT(*) FROM reviews WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}' AND validated=1) AS reviews_count, (SELECT COUNT(*) FROM audit_log WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') AS audit_count, (SELECT status FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id='${MISSION_ID}') AS mission_status, (SELECT status FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id='${NEXT_ID}') AS next_status, (SELECT COUNT(*) FROM mission_progress WHERE family_id='${FAMILY_ID}' AND mission_id>'${NEXT_ID}') AS later_count;"
          npx wrangler d1 execute worldmaker-db --remote --command "$SQL" --json > ../approved-d1.json
          jq -e '.[0].results[0] | .submissions_count >= 2 and .reviews_count >= 2 and .audit_count >= 2 and .mission_status == "APPROVED" and .next_status == "NOT_SUBMITTED" and .later_count == 0' ../approved-d1.json

      - name: Verify learner and parent shared views
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RELEASE_TEST_TOKEN" \
            "$API_URL/internal/release-test/views" > views.json
          jq -e --arg mission "$MISSION_ID" --arg next "$NEXT_ID" '
            .learner.status == 200 and .parent.status == 200 and
            ([.learner.body.progress[] | select(.mission_id == $mission and .status == "APPROVED")] | length == 1) and
            ([.parent.body.progress[] | select(.mission_id == $mission and .status == "APPROVED")] | length == 1) and
            ([.learner.body.progress[] | select(.mission_id == $next and .status == "NOT_SUBMITTED")] | length == 1) and
            ([.parent.body.progress[] | select(.mission_id == $next and .status == "NOT_SUBMITTED")] | length == 1)
          ' views.json

      - name: Build sanitized release report
        shell: bash
        run: |
          set -euo pipefail
          NON_STATUS="$(jq -r '.review.status' non-approved.json)"
          jq -n \
            --arg mission "$MISSION_ID" \
            --arg non "$NON_STATUS" \
            '{
              harness_version:"worldmaker-release-harness-v1",
              mission_id:$mission,
              live_model_classification:{non_approved:$non,valid_submission:"APPROVED"},
              production_d1_smoke:{
                submission_records_immutable:true,
                review_records_immutable:true,
                audit_records_created:true,
                nonapproval_did_not_unlock:true,
                approval_unlocked_exact_next:true,
                no_later_mission_unlocked:true,
                shared_progress_visible:true,
                parent_view_visible:true
              }
            }' > release-report.json
          node scripts/record-live-release-result.mjs "$MISSION_ID" release-report.json
          node scripts/promote-mission.mjs "$MISSION_ID"
          node scripts/configure-release-pilot.mjs "$FAMILY_ID" "$NEXT_ID"
          node scripts/audit-mission-releases.mjs

      - name: Deploy official release and move pilot forward
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Verify official deployment health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$API_URL/health" | jq -e '.ok == true and .service == "nick-worldmaker-api"'

      - name: Commit verified promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "worldmaker-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/index.js backend/wrangler.toml assets/js/mission-release-manifest.js tests/live-results/
          git commit -m "Promote $MISSION_ID after live release gates"
          git push

      - name: Upload sanitized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MISSION_ID }}-release-test
          path: |
            non-approved.json
            approved.json
            non-approved-d1.json
            approved-d1.json
            views.json
            release-report.json
