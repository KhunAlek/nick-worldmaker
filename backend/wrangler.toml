name = "nick-worldmaker-api"
main = "src/index.js"
compatibility_date = "2026-07-13"

[vars]
ALLOWED_ORIGIN = "https://khunalek.github.io"
OPENAI_MODEL = "gpt-4.1-mini"
EVALUATOR_VERSION = "v1-m02-2026-07-13"
SESSION_TTL_HOURS = "720"

[[d1_databases]]
binding = "DB"
database_name = "worldmaker-db"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"

[observability]
enabled = true
