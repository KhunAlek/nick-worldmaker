name = "nick-worldmaker-api"
main = "src/production-entry.js"
compatibility_date = "2026-07-15"

[vars]
ALLOWED_ORIGIN = "https://khunalek.github.io"
OPENAI_MODEL = "gpt-4.1-mini"
EVALUATOR_VERSION = "v1-release-engine-2026-07-15"
SOURCE_VERSION = "github-main-2026-07-15"
SESSION_TTL_HOURS = "720"

[[d1_databases]]
binding = "DB"
database_name = "worldmaker-db"
database_id = "15ed824d-fa44-46c7-8427-7451635a97bf"
migrations_dir = "migrations"

[observability]
enabled = true
