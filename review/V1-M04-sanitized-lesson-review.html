<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1-M04 Sanitized Lesson Review</title><style>
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f6f8fc;color:#172033}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 44px}.card,.step{background:white;border:1px solid #d8e1ef;border-radius:14px;margin:14px 0;padding:18px;box-shadow:0 8px 24px rgba(23,32,51,.06)}.badge{display:inline-block;font-weight:800;color:#295aaf;background:#e8f0ff;border-radius:999px;padding:6px 10px}.lead{font-size:1.15rem;line-height:1.55}.check{background:#eefaf0;border-left:5px solid #31a354;padding:12px;margin:12px 0}.fix{background:#fff7e8;border-left:5px solid #ee9b00;padding:12px;margin:12px 0}.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.concept,.test{border:1px solid #d8e1ef;border-radius:10px;padding:12px;margin:10px 0}.structure,pre{white-space:pre-wrap;background:#101828;color:#eef5ff;border-radius:10px;padding:14px;overflow:auto}summary{font-weight:850;cursor:pointer}.body{padding-top:10px}li{margin:8px 0;line-height:1.5}.code-card{border:1px solid #c7d7f2;border-radius:12px;margin:12px 0;overflow:hidden}.code-title{font-weight:850;background:#e8f0ff;padding:10px 12px}.explain{padding:0 12px 12px;color:#45546f}h1,h2,h3{line-height:1.15}</style></head><body><main class="wrap" id="app"></main>
<script>window.WORLDMAKER_LESSONS={};</script>
<script src="../assets/js/mission-lessons-m04.js"></script>
<script>(function(){const L=window.WORLDMAKER_LESSONS["V1-M04"],app=document.getElementById("app"),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));let out=`<section class="card"><div class="badge">${L.id} · ${L.difficulty}</div><h1>${L.title}</h1><p class="lead">${L.objective}</p><div class="check"><strong>What Nick should see:</strong> ${L.visibleResult}</div><h2>Why this matters</h2><p>${L.whyItMatters}</p><h2>Starting point</h2><p>${L.startingState}</p></section>`;out+=`<section class="card"><h2>New words, explained first</h2><div class="concepts">${L.concepts.map(c=>`<div class="concept"><strong>${c.name}</strong><br>${c.text}</div>`).join("")}</div></section>`;out+=`<section><h2>Build it one step at a time</h2>${L.steps.map((s,i)=>`<details class="step" ${i===0?'open':''}><summary>Step ${i+1} — ${s.title}</summary><div class="body"><ol>${s.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>${(s.codeBlocks||[]).map(b=>`<div class="code-card"><div class="code-title">${esc(b.label)}</div><pre><code>${esc(b.code)}</code></pre><div class="explain">${esc(b.explanation)}</div></div>`).join("")}<div class="check"><strong>Stop and check:</strong> ${esc(s.checkpoint)}</div><div class="fix"><strong>When the result is different:</strong> ${esc(s.recovery)}</div></div></details>`).join("")}</section>`;out+=`<section class="card"><h2>Check these exact Explorer locations</h2><div class="structure">${esc(L.hierarchy)}</div></section>`;out+=`<section class="card"><h2>Proof tests</h2>${L.tests.map(t=>`<div class="test"><strong>${t.name}</strong> <small>(${t.id})</small><br><b>Start:</b> ${t.setup}<br><b>Do:</b> ${t.action}<br><b>See:</b> ${t.expected}</div>`).join("")}</section>`;out+=`<section class="card"><h2>Send current evidence</h2><ol>${L.submission.fields.map(f=>`<li><strong>${f.label}:</strong> ${f.help}</li>`).join("")}</ol><div class="check"><strong>One short explanation:</strong> ${L.submission.understanding}</div></section>`;out+=`<section class="card"><strong>Review boundary:</strong> This page loads only the exact source-controlled M4 lesson file. It does not log in, call the API, save progress, submit evidence, release M4, unlock M5, or change Nick's account.</section>`;app.innerHTML=out;})();</script></body></html>
