<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1-M08 Sanitized Lesson Review</title><style>body{margin:0;background:#08091b;color:#f5f7ff;font:16px/1.55 system-ui}.wrap{max-width:980px;margin:auto;padding:28px}.card{background:#121532;border:1px solid #30365e;border-radius:18px;padding:22px;margin:16px 0}iframe{width:100%;min-height:80vh;border:0;background:white;border-radius:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#20345c;margin-right:8px}</style></head><body><main class="wrap"><p><span class="tag">SANITIZED</span><span class="tag">NO LOGIN</span><span class="tag">READ-ONLY</span></p><section class="card"><h1>V1-M08 — Walk to the Resource</h1><p>This review page loads the exact source-controlled M8 lesson object used by the website candidate. It contains no learner credentials, makes no API request, and writes no learner data.</p></section><section id="lesson" class="card"></section></main><script>window.WORLDMAKER_LESSONS={};</script><script src="../assets/js/mission-lesson-m08-walk-to-resource.js"></script><script>const m=window.WORLDMAKER_LESSONS['V1-M08'];const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.getElementById('lesson').innerHTML=`<h2>${e(m.objective)}</h2><p><strong>Visible result:</strong> ${e(m.visibleResult)}</p><h2>Concepts</h2><ul>${m.concepts.map(x=>`<li><strong>${e(x.name)}:</strong> ${e(x.text)}</li>`).join('')}</ul><h2>Exact paths</h2><pre>${e(m.hierarchy)}</pre>${m.steps.map(s=>`<section class="card"><h2>${e(s.title)}</h2><ol>${s.actions.map(a=>`<li>${e(a)}</li>`).join('')}</ol><p><strong>Checkpoint:</strong> ${e(s.checkpoint)}</p><p><strong>Recovery:</strong> ${e(s.recovery)}</p></section>`).join('')}<h2>Canonical tests</h2>${m.tests.map(t=>`<p><strong>${e(t.id)} — ${e(t.name)}</strong><br>Setup: ${e(t.setup)}<br>Action: ${e(t.action)}<br>Expected: ${e(t.expected)}</p>`).join('')}`;</script></body></html>
