<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1-M08 Beginner Lesson Review</title>
<style>:root{--bg:#070716;--card:#12152f;--line:rgba(255,255,255,.13);--text:#f7f8ff;--muted:#b8bfdc;--cyan:#56f6ff;--green:#97ff82;--gold:#ffd66b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.card,.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}h1{font-size:clamp(2.2rem,6vw,4.5rem);line-height:.95}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#56f6ff19;border:1px solid #56f6ff55;color:var(--cyan);font-weight:800}.lead{font-size:1.12rem;color:var(--muted)}.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.concept{padding:15px;border-radius:14px;background:#ffffff08;border:1px solid var(--line)}details{padding:0;overflow:hidden}summary{padding:18px 20px;cursor:pointer;font-weight:900;background:#ffffff06}.body{padding:18px 20px}.check,.fix{padding:14px;border-radius:12px;margin:14px 0}.check{background:#97ff8212;border:1px solid #97ff8250}.fix{background:#ffd66b12;border:1px solid #ffd66b55}.code-card{margin:14px 0;border:1px solid #56f6ff44;border-radius:13px;overflow:hidden;background:#080a18}.code-title{padding:9px 13px;background:#56f6ff12;color:#a9fbff;font-weight:900}pre{margin:0;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font:500 .9rem/1.5 ui-monospace,monospace}.explain{padding:11px 14px;color:var(--muted);border-top:1px solid var(--line)}.structure{white-space:pre-wrap;background:#080a18;padding:16px;border-radius:13px}.test{padding:14px;border-left:4px solid var(--green);background:#97ff820b;margin:12px 0}</style></head>
<body><main class="wrap"><div class="badge">SANITIZED · NO LOGIN · NO LEARNER DATA</div><div id="app"></div>
<script>window.WORLDMAKER_LESSONS={};</script>
<script src="../assets/js/mission-lesson-m08-walk-to-resource.js"></script>
<script src="../assets/js/mission-lesson-m08-steps-a.js"></script>
<script src="../assets/js/mission-lesson-m08-steps-b.js"></script>
<script src="../assets/js/mission-lesson-m08-finish.js"></script>
<script>(function(){const L=window.WORLDMAKER_LESSONS["V1-M08"],app=document.getElementById("app"),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));let out=`<section class="card"><div class="badge">${L.id} · ${L.difficulty}</div><h1>${L.title}</h1><p class="lead">${L.objective}</p><div class="check"><strong>What Nick should see:</strong> ${L.visibleResult}</div><h2>Why this matters</h2><p>${L.whyItMatters}</p><h2>Starting point</h2><p>${L.startingState}</p></section>`;out+=`<section class="card"><h2>New words, explained first</h2><div class="concepts">${L.concepts.map(c=>`<div class="concept"><strong>${c.name}</strong><br>${c.text}</div>`).join("")}</div></section>`;out+=`<section><h2>Build it one step at a time</h2>${L.steps.map((s,i)=>`<details class="step" ${i===0?'open':''}><summary>Step ${i+1} — ${s.title}</summary><div class="body"><ol>${s.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>${(s.codeBlocks||[]).map(b=>`<div class="code-card"><div class="code-title">${b.label}</div><pre><code>${esc(b.code)}</code></pre><div class="explain">${b.explanation}</div></div>`).join("")}<div class="check"><strong>Stop and check:</strong> ${s.checkpoint}</div><div class="fix"><strong>When the result is different:</strong> ${s.recovery}</div></div></details>`).join("")}</section>`;out+=`<section class="card"><h2>Check these exact Explorer locations</h2><div class="structure">${esc(L.hierarchy)}</div></section>`;out+=`<section class="card"><h2>${L.proofHeading}</h2>${L.tests.map(t=>`<div class="test"><strong>${t.name}</strong> <small>(${t.id})</small><br><b>Start:</b> ${t.setup}<br><b>Do:</b> ${t.action}<br><b>See:</b> ${t.expected}</div>`).join("")}</section>`;out+=`<section class="card"><h2>${L.submissionHeading}</h2><p>${L.submissionIntro}</p><ol>${L.submission.fields.map(f=>`<li><strong>${f.label}:</strong> ${f.help}</li>`).join("")}</ol><div class="check"><strong>One short explanation:</strong> ${L.submission.understanding}</div></section>`;out+=`<section class="card"><strong>Review boundary:</strong> This page loads only the exact source-controlled M8 lesson files. It does not log in, call the API, save progress, submit evidence, release M8, or change Nick's account.</section>`;app.innerHTML=out;})();</script></main></body></html>
